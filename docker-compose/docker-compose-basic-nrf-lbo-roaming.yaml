    oai-ausf-B:
        container_name: "ausf.5gc.mnc10.mcc999.3gppnetwork.org"
        image: oaisoftwarealliance/oai-ausf:develop
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
