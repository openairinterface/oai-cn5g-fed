    oai-upf-B:
        container_name: "upf.5gc.mnc10.mcc999.3gppnetwork.org"
        image: oaisoftwarealliance/oai-upf:develop
        expose:
            - 80/tcp
            - 8080/tcp
            - 2152/udp
            - 8805/udp
        volumes:
            - ./conf/roaming/roaming_config_partnerB.yaml:/openair-upf/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        cap_add:
