    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
    n2:
      interface_name: eth0
      port: 38412
  smf:
    host: smf.5gc.mnc20.mcc999.3gppnetwork.org
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
    n4:
      interface_name: eth0
      port: 8805
  upf:
    host: upf.5gc.mnc20.mcc999.3gppnetwork.org
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
    n3:
      interface_name: eth0
      port: 2152
    n4:
      interface_name: eth0
      port: 8805
    n6:
      interface_name: eth0
    n9:
      interface_name: eth0
      port: 2152
  udm:
    host: udm.5gc.mnc20.mcc999.3gppnetwork.org
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  udr:
    host: udr.5gc.mnc20.mcc999.3gppnetwork.org
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  ausf:
    host: ausf.5gc.mnc20.mcc999.3gppnetwork.org
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  nrf:
    host: nrf.5gc.mnc20.mcc999.3gppnetwork.org
    sbi:
      port: 8080
      api_version: v1
      interface_name: eth0
  sepp:
    host: sepp.5gc.mnc20.mcc999.3gppnetwork.org
    sbi:
      port: 8080
      api_version: v1
