#
# PacketRusher configuration for the basic deployment (docker-compose-basic-nrf.yaml)
# on demo-oai-public-net, used by docs/DEPLOY_SA5G_PAGING_WITH_PACKETRUSHER.md.
#
# Values follow test/template/packetrusher_config.yaml, the robot test bed, with the
# addresses of this network:
#   - PacketRusher gNB: N2 and N3 on 192.168.70.156, pinned in
#     docker-compose-packetrusher.yaml
#   - AMF: the address below is a placeholder; the tutorial replaces it with the
#     address Docker gave oai-amf
#   - subscriber from database/oai_db2.sql: IMSI 208950000000031, SST 222 / SD 00007B,
#     DNN "default"
gnodeb:
  controlif:
    ip: "192.168.70.156"
    port: 9487
  dataif:
    ip: "192.168.70.156"
    port: 2152
  plmnlist:
    mcc: "208"
    mnc: "95"
    tac: "00a000"
    gnbid: "000008"
  slicesupportlist:
    sst: "DE"        # 222 decimal, the SST the subscriber is provisioned with
    sd: "00007B"

ue:
  hplmn:
    mcc: "208"
    mnc: "95"
  msin: "0000000031"        # -> imsi-208950000000031
  routingindicator: "0000"
  protectionScheme: 0
  homeNetworkPublicKey: "5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650"
  homeNetworkPublicKeyID: 1

  # From AuthenticationSubscription in oai_db2.sql
  key: "0C0A34601D4F07677303652C0462535B"
  opc: "63bfa50ee6523365ff14c1f45f88737d"
  amf: "8000"
  sqn: "000000000020"

  dnn: "default"
  snssai:
    sst: 222          # ue.snssai.sst is an int here, unlike the gNB list which is a hex string
    sd: "00007B"

  integrity:
    nia0: false
    nia1: false
    nia2: true
    nia3: false
  ciphering:
    nea0: false
    nea1: false
    nea2: true
    nea3: false

amfif:
  - ip: "192.168.70.132"
    port: 38412

logs:
  level: 4
