apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
   name: oai-udm
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: "oai-udm"
spec:
    runPolicy: "Serial"
    source:
        git:
            uri: "https://github.com/openairinterface/oai-cn5g-udm.git"
            ref: "develop"
    strategy:
        dockerStrategy:
            dockerfilePath: "docker/Dockerfile.udm.centos"
    output:
        to:
            kind: "ImageStreamTag"
            name: "oai-udm:develop"
