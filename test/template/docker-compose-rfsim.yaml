services:
    oai-gnb:
        image: oaisoftwarealliance/oai-gnb:2025.w42
        container_name: REPLACE_NAME
        cap_drop:
            - ALL
        environment:
            USE_ADDITIONAL_OPTIONS: -E --rfsim --log_config.global_log_options level,nocolor,time
            ASAN_OPTIONS: detect_leaks=0
        networks:
            public_test_net:
                ipv4_address: REPLACE_IP
            n3_test_net:
                ipv4_address: REPLACE_IP
        volumes:
            - ../../docker-compose/ran-conf/gnb.yaml:/opt/oai-gnb/etc/gnb.yaml
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            interval: 10s
            timeout: 5s
            retries: 5

    oai-nr-ue:
        image: oaisoftwarealliance/oai-nr-ue:2025.w42
        container_name: REPLACE_NAME
        cap_drop:
            - ALL
        cap_add:
            - NET_ADMIN  # for interface bringup
            - NET_RAW    # for ping
        environment:
            USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 --numerology 1 --uicc0.imsi REPLACE_IMSI -C 3319680000 --rfsimulator.serveraddr REPLACE_IP --log_config.global_log_options level,nocolor,time
        networks:
            public_test_net:
                ipv4_address: REPLACE_IP
        devices:
             - /dev/net/tun:/dev/net/tun
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5

networks:
  n3_test_net:
    external:
      name: test-oai-n3-net
  public_test_net:
    external:
      name: test-oai-public-net
